name: Native Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build native solution
        run: dotnet build windows-native/PhotoRepair.sln -c Release -p:Platform=x64
      - name: Shared contract and core tests
        run: dotnet test windows-native/tests/PhotoRepair.Core.Tests -c Release --no-build --logger trx
      - name: Windows adapters and presentation tests
        run: dotnet test windows-native/tests/PhotoRepair.Windows.Tests -c Release --no-build --logger trx
      - name: Build unsigned MSIX
        run: dotnet build windows-native/src/PhotoRepair.App -c Release -p:Platform=x64 -p:GenerateAppxPackageOnBuild=true -p:AppxPackageSigningEnabled=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-windows-results
          path: |
            windows-native/**/TestResults/*.trx
            windows-native/src/PhotoRepair.App/AppPackages/**
