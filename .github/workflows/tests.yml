name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync
        run: uv sync
      - name: Test
        run: uv run pytest
      - name: Compile
        run: uv run python -m compileall -q photo_repair main.py
      - name: Upload generated lockfile
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: uv-lock
          path: uv.lock
