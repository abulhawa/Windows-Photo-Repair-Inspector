[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-metadata-repair-inspector"
version = "0.1.0"
description = "Windows desktop utility for inspecting and repairing filesystem and EXIF photo timestamps."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10.0",
  "piexif>=1.1.3",
  "pillow-heif>=0.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
photo-repair-inspector = "photo_repair.app:main"

[tool.setuptools.packages.find]
include = ["photo_repair*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
